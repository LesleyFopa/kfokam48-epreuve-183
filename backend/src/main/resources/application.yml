server:
  port: 8080

spring:
  application:
    name: presence
  datasource:
    url: jdbc:h2:mem:presence;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

kfokam48:
  presence:
    duree-validite-code-minutes: 15
    max-tentatives-code: 5
    duree-blocage-minutes: 2
