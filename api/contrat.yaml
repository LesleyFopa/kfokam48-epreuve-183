openapi: 3.0.3
info:
  title: Contrat imposé — Épreuve finale KFOKAM48
  version: "1.2"
  description: |
    Les cinq opérations imposées existent EXACTEMENT ainsi :
    mêmes chemins, mêmes verbes, mêmes codes de statut, même format d'erreur.
    Les opérations supplémentaires ci-dessous ont été ajoutées pendant
    l'analyse (voir docs/CAHIER_DES_CHARGES.md §7) pour couvrir EF8 à EF12.

    v1.2 (étape 3) : GET /api/exercices change de forme — un exercice est
    désormais relu par deux relecteurs distincts (RG5), la note affichée
    est la moyenne des relectures rendues, marquée provisoire tant qu'un
    seul des deux a rendu (RG17). Voir docs/CAHIER_DES_CHARGES.md §7.

servers:
  - url: http://localhost:8080

paths:

  /api/promotions/{promotionId}/etudiants:
    get:
      summary: Liste des étudiants d'une promotion, pour identification sans mot de passe (Q1, EF12)
      parameters:
        - name: promotionId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Liste des étudiants
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, nom]
                  properties:
                    id: { type: integer, format: int64 }
                    nom: { type: string }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

  /api/sessions:
    post:
      summary: Le formateur ouvre une session et obtient un code de présence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [titre, promotionId]
              properties:
                titre: { type: string }
                promotionId: { type: integer, format: int64 }
      responses:
        "201":
          description: Session ouverte
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "400": { $ref: "#/components/responses/Erreur" }

  /api/sessions/active:
    get:
      summary: >
        Le formateur retrouve la session actuellement ouverte pour une
        promotion (EF1, EF8). Oublié à l'analyse : sans ceci, la session
        ouverte n'était retrouvable que via l'état local du navigateur qui
        l'a créée, perdu au moindre changement d'appareil ou de cache.
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Session ouverte trouvée
          content:
            application/json:
              schema:
                type: object
                required: [id, code, ouvertureAt, expirationAt]
                properties:
                  id: { type: integer, format: int64 }
                  code: { type: string }
                  ouvertureAt: { type: string, format: date-time }
                  expirationAt: { type: string, format: date-time }
        "404": { $ref: "#/components/responses/Erreur" }   # AUCUNE_SESSION_OUVERTE

  /api/sessions/{id}/cloturer:
    patch:
      summary: >
        Le formateur clôture la session (EF8, RG9, RG11, RG14).
        Verrouille présences, dépôts et corrections de note sur cette session.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "204": { description: Session clôturée }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_DEJA_CLOTUREE

  /api/sessions/{id}/presences:
    post:
      summary: >
        Le formateur ajoute une présence manuellement, sans code (Q14, EF7, RG13).
        Oublié à l'analyse : POST /api/presences est l'opération imposée pour
        l'étudiant avec code, elle ne pouvait pas être détournée pour ce cas.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [etudiantId]
              properties:
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence ajoutée manuellement
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "404": { $ref: "#/components/responses/Erreur" }   # SESSION_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT

  /api/presences:
    post:
      summary: Un étudiant marque sa présence avec le code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, etudiantId]
              properties:
                code: { type: string }
                etudiantId: { type: integer, format: int64 }
      responses:
        "201":
          description: Présence enregistrée
          content:
            application/json:
              schema:
                type: object
                required: [id, sessionId, etudiantId, source]
                properties:
                  id: { type: integer, format: int64 }
                  sessionId: { type: integer, format: int64 }
                  etudiantId: { type: integer, format: int64 }
                  source: { type: string, enum: [ETUDIANT, FORMATEUR] }
        "400": { $ref: "#/components/responses/Erreur" }   # CODE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # DEJA_PRESENT
        "410": { $ref: "#/components/responses/Erreur" }   # CODE_EXPIRE
        "429": { $ref: "#/components/responses/Erreur" }   # TROP_DE_TENTATIVES (RG3)

  /api/exercices:
    post:
      summary: Un étudiant dépose le lien de son exercice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, etudiantId, lien]
              properties:
                sessionId: { type: integer, format: int64 }
                etudiantId: { type: integer, format: int64 }
                lien: { type: string, format: uri }
      responses:
        "201":
          description: Exercice déposé
          content:
            application/json:
              schema:
                type: object
                required: [id, statut]
                properties:
                  id: { type: integer, format: int64 }
                  statut: { type: string }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "409": { $ref: "#/components/responses/Erreur" }   # EXERCICE_DEJA_DEPOSE
    get:
      summary: >
        Un étudiant consulte ses propres exercices et les relectures reçues,
        sans jamais voir l'identité d'un relecteur (Q8, EF11, EF13).
        Depuis l'étape 3 : deux relecteurs distincts par exercice (RG5), note
        retenue = moyenne des relectures rendues, provisoire tant qu'un seul
        des deux a rendu (RG17).
      parameters:
        - name: etudiantId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Exercices de l'étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, sessionId, lien, statut, provisoire, relectures]
                  properties:
                    id: { type: integer, format: int64 }
                    sessionId: { type: integer, format: int64 }
                    lien: { type: string, format: uri }
                    statut: { type: string, enum: [DEPOSE, EN_ATTENTE, PROVISOIRE, RELU] }
                    noteRetenue:
                      type: number
                      nullable: true
                      description: Moyenne des relectures déjà rendues (null si aucune)
                    provisoire:
                      type: boolean
                      description: Vrai tant qu'un seul des deux relecteurs a rendu sa relecture (RG17)
                    relectures:
                      type: array
                      description: Une entrée par relecteur assigné, jamais son identité
                      items:
                        type: object
                        required: [statut]
                        properties:
                          note: { type: integer, nullable: true }
                          commentaire: { type: string, nullable: true }
                          statut: { type: string, enum: [ASSIGNEE, RENDUE] }

  /api/exercices/{id}:
    put:
      summary: >
        Un étudiant remplace le lien de son exercice, tant qu'aucune
        relecture n'a été commencée (Q13, EF10, RG12)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lien]
              properties:
                lien: { type: string, format: uri }
      responses:
        "200": { description: Lien remplacé }
        "400": { $ref: "#/components/responses/Erreur" }   # LIEN_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # EXERCICE_INCONNU
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_COMMENCEE

  /api/relectures:
    get:
      summary: >
        Un relecteur consulte les relectures qui lui sont assignées, pour
        choisir laquelle rendre (EF5). Oublié à l'analyse : sans ceci,
        rien ne permet au relecteur de découvrir l'identifiant à utiliser
        sur POST /api/relectures/{id}.
      parameters:
        - name: relecteurId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Relectures assignées à ce relecteur
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, exerciceId, lienExercice, statut]
                  properties:
                    id: { type: integer, format: int64 }
                    exerciceId: { type: integer, format: int64 }
                    lienExercice: { type: string, format: uri }
                    statut: { type: string, enum: [ASSIGNEE, RENDUE] }

  /api/relectures/{id}:
    post:
      summary: Un relecteur rend sa note et son commentaire
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture enregistrée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "403": { $ref: "#/components/responses/Erreur" }   # AUTO_RELECTURE
        "409": { $ref: "#/components/responses/Erreur" }   # RELECTURE_DEJA_RENDUE
    put:
      summary: >
        Le relecteur corrige une note déjà rendue, tant que la session
        n'est pas clôturée (Q10 tranché contre Q15, EF9, RG9)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [note, commentaire]
              properties:
                note: { type: integer, minimum: 0, maximum: 20 }
                commentaire: { type: string }
      responses:
        "200": { description: Relecture corrigée }
        "400": { $ref: "#/components/responses/Erreur" }   # NOTE_INVALIDE
        "404": { $ref: "#/components/responses/Erreur" }   # RELECTURE_INCONNUE
        "409": { $ref: "#/components/responses/Erreur" }   # SESSION_CLOTUREE

  /api/tableau:
    get:
      summary: Le tableau récapitulatif du formateur
      parameters:
        - name: promotionId
          in: query
          required: true
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: Récapitulatif par étudiant
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    [etudiantId, nom, presences, exercicesDeposes, moyenne, relecturesEnAttente]
                  properties:
                    etudiantId: { type: integer, format: int64 }
                    nom: { type: string }
                    presences: { type: integer }
                    exercicesDeposes: { type: integer }
                    moyenne: { type: number, nullable: true }
                    relecturesEnAttente: { type: integer }
        "404": { $ref: "#/components/responses/Erreur" }   # PROMOTION_INCONNUE

components:
  schemas:
    Erreur:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Identifiant stable, en majuscules. Exemple - CODE_EXPIRE
        message:
          type: string
          description: Phrase lisible par un humain, en français
  responses:
    Erreur:
      description: |
        Format d'erreur imposé pour TOUTES les erreurs, sans exception.
        Une stack trace, un corps vide ou la page d'erreur par défaut de Spring
        valent zéro sur ce critère.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Erreur" }
          example:
            code: CODE_EXPIRE
            message: Le code de présence a expiré.
